/** Rola até o formulário, sem deixá-lo escondido atrás do cabeçalho fixo. */
function rolarAteForm(){
  const f = document.getElementById('formVerif'); if(!f) return;
  const h = (document.querySelector('header.app')||{}).offsetHeight || 0;
  window.scrollTo(0, f.getBoundingClientRect().top + window.scrollY - h - 8);
}
async function editarLimpeza(v){
  const ed = { id:v.id, filtroId:v.filtroId, data:v.data, nivel:v.nivel||'', comentario:v.comentario||'', antes:[], depois:[], fotos:[] };
  try{
    for(const l of ladosComFotos(v)) ed[l] = (await carregarFotosLimpeza(v.id, l)).slice();
  }catch(e){ showToast('Sem internet para abrir as fotos — tente de novo'); return; }
  state.fertiEditVer = ed;
  state.fertiFiltroDia = v.data;
  render();
  rolarAteForm();
}
function wireFertiFiltros(){
  const irPara = (d)=>{ state.fertiFiltroDia = d; state.fertiEditVer = null; renderMantendoScroll(); };
  document.getElementById('flAnt').onclick = ()=>irPara(somaDias(state.fertiFiltroDia, -1));
  document.getElementById('flProx').onclick = ()=>irPara(somaDias(state.fertiFiltroDia, 1));
  const bh = document.getElementById('flHoje'); if(bh) bh.onclick = ()=>irPara(hojeISO());
  document.querySelectorAll('[data-fdia]').forEach(b=>{ b.onclick = ()=>irPara(b.dataset.fdia); });

  const abrirLimpeza = (filtroId)=>{
    const v = limpezaDoFiltro(state.fertiFiltroDia, filtroId);
    if(v){ editarLimpeza(v); return; }
    state.fertiEditVer = { id:null, filtroId, data: state.fertiFiltroDia, nivel:'', comentario:'', antes:[], depois:[], fotos:[] };
    render();
    rolarAteForm();
  };
  document.querySelectorAll('[data-flt]').forEach(row=>{
    row.querySelector('[data-role="fl-abrir"]').onclick = ()=>abrirLimpeza(row.dataset.flt);
  });
  const sel = document.getElementById('flOutro');
  if(sel) sel.onchange = ()=>{ if(sel.value) abrirLimpeza(sel.value); };
  document.querySelectorAll('[data-fv]').forEach(ch=>{ ch.onclick = ()=>{ state.fertiFiltroVer = ch.dataset.fv; renderMantendoScroll(); }; });

  const form = document.getElementById('formVerif');
  if(form){
    const ed = state.fertiEditVer;
    const lerCampos = ()=>{
      ed.data = document.getElementById('fvData').value || ed.data;
      ed.comentario = document.getElementById('fvComentario').value;
    };
    document.getElementById('fvData').addEventListener('change', ()=>{ lerCampos(); renderMantendoScroll(); });
    form.querySelectorAll('[data-nivel]').forEach(ch=>{ ch.onclick = ()=>{ lerCampos(); ed.nivel = ch.dataset.nivel; renderMantendoScroll(); }; });
    form.querySelectorAll('[data-role="fl-foto-add"]').forEach(btn=>{
      const lado = btn.dataset.lado;
      const input = form.querySelector(`[data-role="fl-foto-input"][data-lado="${lado}"]`);
      btn.onclick = ()=>input.click();
      input.addEventListener('change', async e=>{
        lerCampos();
        const files = [...e.target.files];
        if(!files.length) return;
        showToast('Processando foto...');
        for(const f of files){
          if(ed[lado].length >= FOTOS_FILTRO_MAX) break;
          try{ ed[lado].push(await compressImage(f, 900, 0.6)); }catch(err){}
        }
        renderMantendoScroll();
      });
    });
    form.querySelectorAll('.photo-thumb[data-lado]').forEach(th=>{
      const lado = th.dataset.lado, i = Number(th.dataset.idx);
      th.querySelector('img').onclick = ()=>openLightbox(ed[lado][i]);
      th.querySelector('[data-role="fl-foto-rm"]').onclick = ()=>{ lerCampos(); ed[lado].splice(i,1); renderMantendoScroll(); };
    });
    document.getElementById('fvCancelar').onclick = ()=>{ state.fertiEditVer = null; renderMantendoScroll(); };
    document.getElementById('fvSalvar').onclick = ()=>{
      lerCampos();
      if(!ed.data){ showToast('Informe a data da limpeza'); return; }
      if(!ed.nivel){ showToast('Escolha o nível de sujidade'); return; }
      if(state.ferti.verificacoes.some(v=>v.data===ed.data && v.filtroId===ed.filtroId && v.id!==ed.id)){
        showToast(`Já existe limpeza do ${nomeFiltro(ed.filtroId)} em ${fmtBR(ed.data)} — edite aquela`); return;
      }
      const id = ed.id || uid();
      const anterior = state.ferti.verificacoes.find(v=>v.id===id) || {};
      const registro = { id, data: ed.data, filtroId: ed.filtroId, nivel: ed.nivel, comentario: ed.comentario,
        qtdAntes: ed.antes.length, qtdDepois: ed.depois.length };
      if(ed.fotos.length) registro.qtdFotos = ed.fotos.length;
      const i = state.ferti.verificacoes.findIndex(v=>v.id===id);
      if(i>=0) state.ferti.verificacoes[i] = registro; else state.ferti.verificacoes.push(registro);
      if(ed.antes.length || anterior.qtdAntes) salvarFotosLimpeza(id, 'antes', ed.antes);
      if(ed.depois.length || anterior.qtdDepois) salvarFotosLimpeza(id, 'depois', ed.depois);
      if(ed.fotos.length || anterior.qtdFotos) salvarFotosLimpeza(id, 'fotos', ed.fotos);
      agendarSalvarFerti();
      state.fertiEditVer = null;
      state.fertiFiltroDia = ed.data;
      const falta = !ed.antes.length && !ed.depois.length ? 'de antes e de depois' : (!ed.antes.length ? 'de antes' : (!ed.depois.length ? 'de depois' : ''));
      showToast(falta ? `Limpeza salva — sem foto ${falta}` : 'Limpeza salva');
      renderMantendoScroll();
    };
  }

  document.querySelectorAll('[data-ver]').forEach(card=>{
    const v = state.ferti.verificacoes.find(x=>x.id===card.dataset.ver);
    if(!v) return;
    const btnFotos = card.querySelector('[data-role="ver-carregar-fotos"]');
    if(btnFotos) btnFotos.onclick = async ()=>{
      btnFotos.textContent = 'Carregando…';
      try{ await Promise.all(ladosComFotos(v).map(l=>carregarFotosLimpeza(v.id, l))); renderMantendoScroll(); }
      catch(e){ btnFotos.textContent = 'Sem internet — tente de novo'; }
    };
    card.querySelectorAll('.photo-thumb[data-lado] img').forEach(img=>{
      const th = img.closest('.photo-thumb');
      img.onclick = ()=>openLightbox(cacheFotosFiltro[v.id+'|'+th.dataset.lado][Number(th.dataset.idx)]);
    });
    card.querySelector('[data-role="ver-editar"]').onclick = ()=>editarLimpeza(v);
    card.querySelector('[data-role="ver-excluir"]').onclick = ()=>{
      if(!confirm(`Excluir a limpeza do ${nomeFiltro(v.filtroId)} de ${fmtBR(v.data)}?`)) return;
      state.ferti.verificacoes = state.ferti.verificacoes.filter(x=>x.id!==v.id);
      ladosComFotos(v).forEach(l=>salvarFotosLimpeza(v.id, l, []));
      agendarSalvarFerti();
      renderMantendoScroll();
    };
  });
}

/** Libera a aba Caixas com a senha do administrador (a mesma que protege a exclusão de setores). */
async function desbloquearCaixas(){
  await garantirConfigAgora();
  if(!state.configCarregadoOk){ alert('Sem internet agora — não deu para conferir a senha do administrador.\n\nTente de novo quando a internet voltar.'); return; }
  if(!state.senhaExclusao){
    if(!confirm('Ainda não existe senha do administrador.\n\nCriar uma agora? Ela também passa a proteger a exclusão de setores.')) return;
    const nova = prompt('Crie a senha do administrador:', '');
    if(nova===null || !nova.trim()){ showToast('Senha não criada'); return; }
    state.senhaExclusao = nova.trim();
    agendarSalvarConfig();
    state.fertiAdminOk = true;
    showToast('Senha criada — edição liberada');
    renderMantendoScroll();
    return;
  }
  const digitada = prompt('Senha do administrador:');
  if(digitada===null) return;
  if(digitada === state.senhaExclusao){ state.fertiAdminOk = true; showToast('Edição liberada'); renderMantendoScroll(); }
  else alert('Senha incorreta.');
}

/* ---------------- RECONEXÃO AUTOMÁTICA ----------------
   Se ao abrir não deu para confirmar a senha de exclusão (sem internet ou sinal fraco),
   o app tenta de novo sozinho: a cada 20 s, quando a internet volta e quando você volta
   para o app. Quando consegue, o aviso some sem precisar fechar e abrir. */
let reconectando = null, timerReconexao = null;
function aplicarConfig(config){
  if(!config) return;
  if(config.webAppUrl) state.webAppUrl = config.webAppUrl;
  if(config.senhaExclusao!==undefined) state.senhaExclusao = config.senhaExclusao;
  if(Array.isArray(config.pragasTipos) && config.pragasTipos.length) state.pragasTipos = config.pragasTipos;
  if(Array.isArray(config.aplicacoesCacau)) state.aplicacoesCacau = config.aplicacoesCacau;
  if(Array.isArray(config.produtosAplicacao)) state.produtosAplicacao = config.produtosAplicacao;
}
function tentarReconectar(avisar){
  if(reconectando) return reconectando;
  reconectando = (async ()=>{
    try{
      const cfgDoc = await comPrazo(getDoc(doc(db,'config','app')), 10000);
      aplicarConfig(cfgDoc.exists() ? cfgDoc.data() : null);
      state.configCarregadoOk = true;
      pararReconexao();
      if(!state.fertiCarregado) await carregarFerti();
      if(!state.setores.length){
        // não tinha conseguido carregar os setores: traz agora (sem apagar nada criado no aparelho)
        try{
          const snap = await comPrazo(getDocs(collection(db,'setores')), 15000);
          const ids = new Set(state.setores.map(x=>x.id)), novos = [];
          snap.forEach(d=>{ const x = d.data(); if(x && !ids.has(x.id)) novos.push(x); });
          if(novos.length){ migrarSetoresPragas(novos); state.setores = state.setores.concat(novos); }
        }catch(e){}
      }
      if(state.view==='home' || state.view==='modulo-list') render();
      if(avisar) showToast('✓ Conexão de volta — senha do administrador confirmada');
      return true;
    }catch(e){
      return false;
    }finally{
      reconectando = null;
    }
  })();
  return reconectando;
}
function iniciarReconexao(){
  if(timerReconexao || state.configCarregadoOk) return;
  timerReconexao = setInterval(()=>{ if(navigator.onLine !== false) tentarReconectar(true); }, 20000);
}
function pararReconexao(){
  if(timerReconexao){ clearInterval(timerReconexao); timerReconexao = null; }
}
/** Antes de excluir ou mexer na senha: se ainda não confirmou, tenta na hora. */
async function garantirConfigAgora(){
  if(state.configCarregadoOk) return true;
  showToast('Conferindo a senha do administrador…');
  return await tentarReconectar(false);
}
window.addEventListener('online', ()=>{ if(!state.configCarregadoOk) tentarReconectar(true); });
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && !state.configCarregadoOk) tentarReconectar(true);
});

document.getElementById('app').innerHTML = '<div class="empty-state">Carregando seus dados…</div>';
try{
  const { setores, config, configFalhou, doAparelho } = await carregarTudoDoFirestore();
  state.setores = setores;
  aplicarConfig(config);
  state.configCarregadoOk = !configFalhou;
  migrarSetoresPragas(state.setores);
  await carregarFerti();
  if(configFalhou){
    showToast('Sem conexão boa agora — vou confirmar a senha do administrador sozinho quando a internet voltar');
  } else if(doAparelho){
    showToast(`Sem internet — ${setores.length} setor(es) do aparelho. Tudo fica salvo e vai para a planilha quando a internet voltar.`);
  } else {
    showToast(setores.length ? `${setores.length} setor(es) carregado(s)` : 'Pronto — nenhum setor ainda');
  }
}catch(err){
  console.error('Falha ao carregar do Firestore:', err);
  state.configCarregadoOk = false;
  showToast('Sem conexão boa agora — o app vai tentar de novo sozinho');
}
if(!state.ferti) aplicarFerti(null);
render();
if(!state.configCarregadoOk) iniciarReconexao();
if(navigator.onLine !== false && temPendenteSheets()) agendarAutoSyncSheets();
</script>
</body>
</html>
